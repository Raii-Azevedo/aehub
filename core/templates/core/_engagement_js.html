<script>
// ── Engagement: likes + star ratings ──

const CSRF = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}';

function toggleLike(btn) {
    const type = btn.dataset.type;
    const id   = btn.dataset.id;
    fetch(`/api/like/${type}/${id}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' }
    })
    .then(r => r.json())
    .then(data => {
        btn.querySelector('.like-count').textContent = data.count;
        if (data.liked) {
            btn.classList.replace('btn-outline-secondary', 'btn-warning');
        } else {
            btn.classList.replace('btn-warning', 'btn-outline-secondary');
        }
    })
    .catch(console.error);
}

function submitRating(type, id, val, rowEl) {
    fetch(`/api/rate/${type}/${id}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating: val })
    })
    .then(r => r.json())
    .then(data => {
        renderStars(rowEl, data.avg, val);
        // update or create avg label
        let label = rowEl.querySelector('.avg-label');
        if (!label) {
            label = document.createElement('small');
            label.className = 'text-white-50 ms-1 avg-label';
            label.style.fontSize = '.75rem';
            rowEl.appendChild(label);
        }
        label.textContent = `${data.avg} (${data.count})`;
    })
    .catch(console.error);
}

function renderStars(rowEl, avg, userRating) {
    rowEl.querySelectorAll('.star-icon').forEach((star, i) => {
        const val = i + 1;
        star.className = 'bi star-icon';
        star.style.cursor = 'pointer';
        star.style.fontSize = '.9rem';
        if (avg && val <= Math.round(avg)) {
            star.classList.add('bi-star-fill', 'text-warning');
        } else {
            star.classList.add('bi-star');
        }
    });
}

// Hover effect on star rows
document.querySelectorAll('.star-row').forEach(row => {
    const stars = row.querySelectorAll('.star-icon');
    stars.forEach((star, i) => {
        star.addEventListener('mouseenter', () => {
            stars.forEach((s, j) => {
                s.className = 'bi star-icon';
                s.style.fontSize = '.9rem';
                s.style.cursor = 'pointer';
                s.classList.add(j <= i ? 'bi-star-fill text-warning' : 'bi-star');
            });
        });
        star.addEventListener('mouseleave', () => {
            const avg = parseFloat(row.dataset.avgRating || 0);
            const userR = parseInt(row.dataset.userRating || 0);
            renderStars(row, userR || avg, userR);
        });
    });
    // seed initial state from data attribute
    const userR = parseInt(row.dataset.userRating || 0);
    if (userR) renderStars(row, userR, userR);
});

// ── Comments (single shared modal, opt-in — never shown inline on the card) ──

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
}

function openComments(type, id, titulo) {
    const modalEl = document.getElementById('modalComments');
    if (!modalEl) return;
    modalEl.dataset.type = type;
    modalEl.dataset.id = id;

    const titleEl = modalEl.querySelector('.comments-modal-title');
    if (titleEl) titleEl.textContent = titulo ? `💬 Comments — ${titulo}` : '💬 Comments';

    modalEl.querySelector('.comment-input').value = '';
    loadComments(type, id, modalEl);

    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
}

function loadComments(type, id, modalEl) {
    const listEl = modalEl.querySelector('.comments-list');
    listEl.innerHTML = '<small class="text-white-50">Loading comments…</small>';
    fetch(`/api/comments/${type}/${id}/`)
        .then(r => r.json())
        .then(data => renderComments(modalEl, data.comments || []))
        .catch(() => { listEl.innerHTML = '<small class="text-danger">Could not load comments.</small>'; });
}

function renderComments(modalEl, comments) {
    const listEl = modalEl.querySelector('.comments-list');
    if (!comments.length) {
        listEl.innerHTML = '<small class="text-white-50">No comments yet — be the first!</small>';
        return;
    }
    listEl.innerHTML = comments.map(c => `
        <div class="comment-item mb-2 pb-2 border-bottom border-secondary">
            <div class="d-flex justify-content-between align-items-start">
                <strong class="small">${escapeHtml(c.nome)}</strong>
                <small class="text-white-50" style="font-size:.7rem;white-space:nowrap;">${escapeHtml(c.data)}</small>
            </div>
            <div class="small" style="white-space:pre-wrap;color:rgba(255,255,255,0.85);">${escapeHtml(c.texto)}</div>
            ${c.pode_excluir ? `<button type="button" class="btn btn-sm btn-link text-danger p-0" style="font-size:.7rem;" onclick="deleteComment(${c.id}, this)">Delete</button>` : ''}
        </div>
    `).join('');
}

function updateCommentBadge(type, id, count) {
    const toggleBtn = document.querySelector(`.comment-toggle-btn[data-type="${type}"][data-id="${id}"]`);
    if (toggleBtn) {
        const badge = toggleBtn.querySelector('.comment-count');
        if (badge) badge.textContent = count;
    }
}

function postComment(btn) {
    const modalEl = document.getElementById('modalComments');
    const type = modalEl.dataset.type, id = modalEl.dataset.id;
    const input = modalEl.querySelector('.comment-input');
    const texto = input.value.trim();
    if (!texto) return;
    btn.disabled = true;
    fetch(`/api/comments/${type}/${id}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
    })
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        if (data.error) { alert(data.error); return; }
        input.value = '';
        loadComments(type, id, modalEl);
        updateCommentBadge(type, id, data.count);
    })
    .catch(err => { btn.disabled = false; console.error(err); });
}

function deleteComment(commentId, linkEl) {
    if (!confirm('Delete this comment?')) return;
    const modalEl = document.getElementById('modalComments');
    const type = modalEl.dataset.type, id = modalEl.dataset.id;
    fetch(`/api/comments/excluir/${commentId}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF }
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        loadComments(type, id, modalEl);
        updateCommentBadge(type, id, data.count);
    })
    .catch(console.error);
}

// Allow Enter (without Shift) to submit a comment from the modal's input
document.addEventListener('DOMContentLoaded', () => {
    const modalEl = document.getElementById('modalComments');
    const input = modalEl && modalEl.querySelector('.comment-input');
    if (!input) return;
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            modalEl.querySelector('.comment-post-btn')?.click();
        }
    });
});
</script>
